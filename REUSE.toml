version = 1
SPDX-PackageName = "Weather"
SPDX-PackageSupplier = "Saalim Quadri <danascape@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/PVOT-OSS/PvotWeather"

[[annotations]]
path = ["app/src/main/res/mipmap-*/*.webp", "core/*/schemas/**", "gradle/gradle-daemon-jvm.properties"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Saalim Quadri <danascape@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "gradle/wrapper/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007-2023 Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["core/network/src/test/resources/fixtures/om-*.json", "core/network/src/test/resources/fixtures/geo-*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Open-Meteo.com"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "core/network/src/test/resources/fixtures/met-*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "The Norwegian Meteorological Institute (MET Norway)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["app/src/main/res/drawable/ic_check.xml", "app/src/main/res/drawable/ic_close.xml", "app/src/main/res/drawable/ic_delete.xml", "app/src/main/res/drawable/ic_menu.xml", "app/src/main/res/drawable/ic_my_location.xml", "app/src/main/res/drawable/ic_place.xml", "app/src/main/res/drawable/ic_search.xml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC (Material Icons)"
SPDX-License-Identifier = "Apache-2.0"
