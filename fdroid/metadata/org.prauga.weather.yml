PackageName: org.prauga.weather
Name: Weather
Summary: Forecasts from Open-Meteo and MET Norway, combined
License: Apache-2.0
AuthorName: Saalim Quadri
SourceCode: https://github.com/PVOT-OSS/PvotWeather
IssueTracker: https://github.com/PVOT-OSS/PvotWeather/issues
WebSite: ""
Categories:
  - Science & Education
AntiFeatures:
  NonFreeNet:
    en-US: Forecasts come from the Open-Meteo and MET Norway web services.
CurrentVersion: "1.0.0"
CurrentVersionCode: 10000
Description: |
  Weather builds every forecast from two free, open sources at once,
  Open-Meteo and MET Norway, shows their average and lets you see what each
  one said and how sure they are.

RepoType: git
Repo: https://github.com/PVOT-OSS/PvotWeather.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: v1.0.0
    subdir: app
    srclibs:
      - PvotLib@v1.0.0
    prebuild:
      - sed -i -e '/pvot-oss.github.io/,+2d' ../settings.gradle.kts
      - echo "pvotLibDir=$$PvotLib$$" >> ../gradle.properties
    gradle:
      - yes
